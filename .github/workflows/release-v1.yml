name: Create v1.0.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1 && exit 0
          gh release create v1.0.0 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "YouTubeAudioDownloader v1.0.0 (Intel)" \
            --notes-file - <<'NOTES'
          Initial Intel macOS release.

          - Downloads YouTube audio as M4A, MP3, or OPUS
          - Downloads QuickTime-compatible MP4 video
          - Bundles Intel ffmpeg and ffprobe plus universal yt-dlp
          - Requires macOS 14 or later on an Intel Mac

          Download one of GitHub's automatically generated source archives. The bundled command-line tools are included.
          NOTES
